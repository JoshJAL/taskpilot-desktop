appId: dev.task-pilot.desktop
productName: TaskPilot
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
win:
  target:
    - nsis
  icon: resources/icon.ico
  artifactName: TaskPilot-Setup.${ext}
  signingHashAlgorithms:
    - sha256
  certificateFile: resources/taskpilot-cert.pfx
  certificatePassword: ${WIN_CSC_KEY_PASSWORD}
mac:
  target:
    - dmg
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  artifactName: TaskPilot-mac.${ext}
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development
appImage:
  artifactName: TaskPilot.${ext}
deb:
  artifactName: TaskPilot.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: JoshJAL
  repo: taskpilot-desktop
